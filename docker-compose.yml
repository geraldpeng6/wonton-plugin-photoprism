# PhotoPrism 相册：照片读共享文件夹 photos（只读），索引、缩略图和人脸数据都在插件数据目录。
# 应用自己不设登录（上游公共模式），网页只经核心网关进来；不申请出网，相册功能都在本地。
services:
  photoprism:
    # 上游官方镜像（社区版），标签对应上游 261029-963b58c50 发布版，amd64 和 arm64 都有。
    image: photoprism/photoprism:261029@sha256:9409cf8e5a6ebcbe3170d14537556cbc20997aaa307096d6eeedbfc5eeef6719
    # 不写 user:：镜像入口以 root 建账号、把存储目录交给传入的 PUID:PGID，再用 setpriv 降权跑服务进程，
    # 宿主上的数据文件归用户的用户。降权前只动 /photoprism/storage，不碰只读的 originals。
    environment:
      # 插值变量不会自动进容器环境：显式交给入口脚本，服务进程 setpriv 降权到宿主用户、时区正确。
      TZ: ${TZ}
      PHOTOPRISM_UID: ${PUID}
      PHOTOPRISM_GID: ${PGID}
      # 关掉应用自己的登录（上游"公共模式"，访客拥有管理员权限）：装好即用，不再多一次登录；
      # 唯一的门是核心网关的会话校验，匿名请求到不了应用。
      PHOTOPRISM_AUTH_MODE: "public"
      # 网关转发的是 HTTP，跳过上游默认的自签 TLS 证书初始化（容器不做 TLS）。
      PHOTOPRISM_INIT: ""
      # 网页的公开地址，应用生成外链时用。
      PHOTOPRISM_SITE_URL: ${WONTON_APP_URL}/
      # 上游默认 en，且后端加载后压过浏览器语言探测（实测）：预置简体中文，用户仍可在设置里切换。
      PHOTOPRISM_DEFAULT_LOCALE: "zh"
      # 登录已关，这个密码没有登录入口可用；设它只是别让（已禁用的）admin 用上游公开的默认密码 "photoprism"。
      PHOTOPRISM_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      # originals 只读挂载：关掉一切要写 originals 的功能（上传、导入、WebDAV）。
      PHOTOPRISM_READONLY: "true"
      PHOTOPRISM_DISABLE_WEBDAV: "true"
      # places 的反向地理编码调用上游托管服务 places.photoprism.app，会把 GPS 坐标发给第三方；
      # 插件不出网，关掉它：地点/地图不可用，其余功能不受影响（要开就加 network.egress 并删掉这行）。
      PHOTOPRISM_DISABLE_PLACES: "true"
      # 上游兼容 SQLite 和 MariaDB 10.5.12+；单用户、无并发的场景用 SQLite（镜像默认驱动），省一个数据库容器。
      PHOTOPRISM_DATABASE_DRIVER: "sqlite"
    volumes:
      # 照片只读：共享文件夹以 :ro 挂进上游约定的 originals 路径。
      - ${WONTON_SHARE_PHOTOS}:/photoprism/originals:ro
      # 索引数据库（SQLite）、缩略图缓存和 sidecar 备份都在插件数据目录里，重装不丢。
      - ${WONTON_APP_DATA}/storage:/photoprism/storage
    healthcheck:
      # /api/v1/config 在应用就绪、数据库打开后才返回 200 的配置 JSON。
      test: ["CMD", "curl", "--silent", "--show-error", "--fail", "http://127.0.0.1:2342/api/v1/config"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 5s

x-wonton:
  spec: "0.4"
  id: app.photoprism.photoprism
  version: 0.1.0
  kind: app
  title: { en: PhotoPrism }
  description:
    zh: 把共享文件夹里的照片整理成可搜索的相册
    en: Turn the photos in your shared folder into a searchable library
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/library.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://www.photoprism.app
  # 上游应用的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: AGPL-3.0-only
  tags:
    zh: [相册]
    en: [Photos]
  about:
    zh: |
      把共享文件夹里的照片整理成自己的相册：按时间、人物和画面内容浏览、搜索；在网页里点一下索引，新照片就进时间线。

      应用自己不设登录，由云吞登录挡在前面，打开就能用。照片文件只读，不会被改动。
    en: |
      Turn the photos in your shared folder into your own library: browse and search by time, people and subject. One click to index, and new photos join the timeline.

      The app has no login of its own; Wonton's sign-in stands in front of it, so opening the page is enough. Photo files are read-only and never modified.
  release_notes: { zh: 首个版本。, en: First release. }
  webui:
    service: photoprism
    port: 2342
    sso: none
  secrets:
    admin_password:
      generate: { bytes: 32 }
  permissions:
    - storage.share.photos:read
  # 上游官方镜像，amd64 和 arm64 都有（Docker Hub 清单）；上游要求至少 3 GB 内存（1 GB 及以下自动关掉 RAW 转换和人脸识别）。
  requirements:
    arch: [amd64, arm64]
    memory: 3G
